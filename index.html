<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label 24x50mm - Double Two Interior</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        /* Gaya Tampilan Web (Tidak Ikut Tercetak) */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 20px; 
        }
        .dashboard-ui { 
            max-width: 500px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555;}
        input, select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #2c3e50; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: 0.3s; 
            margin-top: 10px;
        }
        button:hover { background-color: #1a252f; }
        #status { font-size: 12px; color: #666; text-align: center; margin-bottom: 15px; }

        /* Wadah Preview di Layar Komputer */
        .preview-container { 
            margin-top: 20px; 
            border-top: 1px solid #eee; 
            padding-top: 20px; 
            display: flex; 
            justify-content: center;
        }

        /* -------------------------------------------------------------
           PENGATURAN AREA CETAK (THERMAL LABEL 50mm x 24mm)
        -------------------------------------------------------------- */
        #printArea {
            display: none; /* Disembunyikan di UI utama, hanya dipanggil saat cetak */
        }
        
        .label-box {
            width: 50mm;
            height: 24mm; /* Diperbarui dari 30mm menjadi 24mm */
            background: white;
            box-sizing: border-box;
            border: 1px dashed #ccc; 
            padding: 1.5mm 2mm; /* Padding disesuaikan agar isi tidak terlalu mepet tepi */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        .label-header {
            font-size: 6.5px; /* Font dikecilkan sedikit */
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
            letter-spacing: 0.5px;
            margin-bottom: 0.5mm;
        }

        .label-product {
            font-size: 8px; /* Ukuran font produk */
            font-weight: 800;
            text-align: center;
            line-height: 1.1;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .label-price {
            font-size: 7.5px;
            font-weight: bold;
            margin-top: 0.5mm;
        }

        .barcode-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* Media Print Khusus Tarikan Printer */
        @media print {
            body * { visibility: hidden; }
            body { background: white; margin: 0; padding: 0; }
            .dashboard-ui, .preview-container { display: none !important; }
            
            #printArea {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
            }

            .label-box {
                border: none; /* Garis panduan putus-putus hilang saat dicetak */
                padding: 1.5mm; 
            }

            @page {
                size: 50mm 24mm; /* Lebar 50mm, Tinggi Kertas (Tape) 24mm */
                margin: 0mm;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-ui">
        <h2>Cetak Label Showroom</h2>
        <div id="status">Mengunduh data dari database...</div>
        
        <div class="form-group">
            <label for="searchSKU">Cari Sampel (Nama / SKU):</label>
            <input type="text" id="searchSKU" placeholder="Ketik Gorden Grand 05..." autocomplete="off">
        </div>
        
        <div class="form-group">
            <select id="resultList" size="6" style="display:none;"></select>
        </div>

        <button onclick="window.print()">🖨️ Cetak Label</button>

        <div class="preview-container">
            <div id="previewBox">
                </div>
        </div>
    </div>

    <div id="printArea">
        <div class="label-box">
            <div class="label-header">DOUBLE TWO INTERIOR</div>
            <div class="label-product" id="lblProduct">Silakan Pilih Produk</div>
            <div class="barcode-container">
                <svg id="lblBarcode"></svg>
            </div>
            <div class="label-price" id="lblPrice">Rp 0 / Satuan</div>
        </div>
    </div>

    <script>
        // Link CSV Google Sheets (Terintegrasi Langsung)
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vScNAy0w1lHYGke4r8BL9D-9ZpwJMlpk2Joh0Z0pEI_XSlXxhldetTXzCL_MnQfbEOrT-uu6XAqIfte/pub?output=csv';
        let productData = [];

        async function fetchDatabase() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('Gagal memuat');
                const text = await response.text();
                
                if(text.trim().toLowerCase().startsWith("<!doctype html>")) {
                    document.getElementById('status').innerText = "⚠️ Error: Akses tertutup. Cek pengaturan Publish to Web.";
                    return;
                }
                
                parseCSV(text);
                document.getElementById('status').innerText = "✅ " + productData.length + " produk siap dicetak.";
            } catch (error) {
                document.getElementById('status').innerText = "⚠️ Gagal mengambil data. Periksa jaringan internet.";
            }
        }

        // Parser CSV yang tahan terhadap karakter koma di dalam teks (Robust Regex)
        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            for(let i = 1; i < lines.length; i++) {
                if(!lines[i].trim()) continue;
                
                let inQuote = false;
                let value = '';
                let row = [];
                for (let j = 0; j < lines[i].length; j++) {
                    let char = lines[i][j];
                    if (inQuote) {
                        if (char === '"' && lines[i][j + 1] === '"') { value += '"'; j++; }
                        else if (char === '"') { inQuote = false; }
                        else { value += char; }
                    } else {
                        if (char === '"') { inQuote = true; }
                        else if (char === ',') { row.push(value); value = ''; }
                        else { value += char; }
                    }
                }
                row.push(value);
                
                if(row.length >= 8) {
                    const barcode = row[0] ? row[0].trim() : '';
                    const sku = row[1] ? row[1].trim() : '';
                    const nama = row[3] ? row[3].trim() : '';
                    const warna = row[4] ? row[4].trim() : '';
                    const harga = row[6] ? row[6].trim() : '';
                    const satuan = row[7] ? row[7].trim() : '';

                    if(sku || nama) {
                        productData.push({ barcode, sku, nama, warna, harga, satuan });
                    }
                }
            }
        }

        const searchInput = document.getElementById('searchSKU');
        const resultList = document.getElementById('resultList');

        searchInput.addEventListener('input', function() {
            const keyword = this.value.toLowerCase();
            resultList.innerHTML = '';
            
            if(keyword.length < 2) {
                resultList.style.display = 'none';
                return;
            }

            const filtered = productData.filter(p => 
                p.nama.toLowerCase().includes(keyword) || 
                p.sku.toLowerCase().includes(keyword) ||
                p.barcode.toLowerCase().includes(keyword)
            ).slice(0, 10); 

            if(filtered.length > 0) {
                resultList.style.display = 'block';
                filtered.forEach(p => {
                    const option = document.createElement('option');
                    let displayText = p.nama;
                    if(p.warna && p.warna !== "-") displayText += ` (${p.warna})`;
                    option.text = displayText;
                    option.value = JSON.stringify(p);
                    resultList.add(option);
                });
            } else {
                resultList.style.display = 'none';
            }
        });

        resultList.addEventListener('change', function() {
            if(!this.value) return;
            const data = JSON.parse(this.value);
            
            let prodName = data.nama;
            if(data.warna && data.warna !== "-") prodName += ` ${data.warna}`;
            document.getElementById('lblProduct').innerText = prodName.substring(0, 26); 

            let hargaFormat = parseInt(data.harga.replace(/\D/g,'')) || 0;
            if(hargaFormat > 0) {
                document.getElementById('lblPrice').innerText = `Rp ${hargaFormat.toLocaleString('id-ID')} / ${data.satuan}`;
            } else {
                document.getElementById('lblPrice').innerText = "Harga Belum Diatur";
            }

            const codeToPrint = data.barcode || data.sku;
            if(codeToPrint) {
                JsBarcode("#lblBarcode", codeToPrint, {
                    format: "CODE128",
                    displayValue: true,
                    fontSize: 9, /* Font angka barcode dikecilkan sedikit */
                    margin: 0,
                    width: 1.3, 
                    height: 20  /* TINGGI BARCODE DIPENDEKKAN agar muat di area 24mm */
                });
            }

            document.getElementById('previewBox').innerHTML = document.getElementById('printArea').innerHTML;
            document.getElementById('printArea').style.display = 'block'; 
        });

        fetchDatabase();
    </script>
</body>
</html>
