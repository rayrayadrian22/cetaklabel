<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label Otomatis - Double Two Interior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        /* =========================================
           PENGATURAN CETAK KHUSUS EPSON LW-600P
           Tape 24mm | Potongan 50mm (Landscape)
           ========================================= */
        @media print {
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                position: fixed;
                left: 0;
                top: 0;
                width: 50mm !important;
                height: 24mm !important;
                padding: 1.5mm !important;
                margin: 0 !important;
                box-sizing: border-box !important;
                background-color: white !important;
                display: flex !important;
                align-items: center !important;
                justify-content: flex-start !important;
                gap: 2mm !important;
                page-break-after: always;
            }
            @page {
                size: 50mm 24mm;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-lg w-full border border-gray-200">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900 uppercase tracking-widest">Cetak Label 24mm</h1>
            <p class="text-sm text-gray-500">Auto-Sync Google Sheets (Khusus SKU Induk)</p>
        </div>

        <div id="loadingStatus" class="mb-4 text-center text-sm font-bold text-amber-500 animate-pulse">
            ⏳ Sedang menghubungkan ke Database...
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Cari Produk / SKU Induk</label>
                <input type="text" id="searchBox" list="skuList" onchange="autoFillLabel()" onkeyup="autoFillLabel()" placeholder="Ketik nama sampel atau SKU..." class="w-full p-3.5 rounded-xl border-2 border-gray-300 focus:border-amber-400 outline-none transition-all text-sm font-medium bg-gray-50">
                <datalist id="skuList"></datalist>
            </div>
            
            <p class="text-xs text-gray-400 italic">*Pilih dari daftar drop-down, label akan terisi otomatis.</p>
        </div>

        <hr class="my-8 border-gray-200">

        <div class="flex flex-col items-center">
            <p class="text-xs font-bold text-gray-400 uppercase mb-3">Pratinjau Kertas Aktual (50x24 mm)</p>
            
            <div id="printArea" style="width: 50mm; height: 24mm; padding: 1.5mm;" class="bg-[#FDE047] border border-gray-400 flex items-center shadow-inner overflow-hidden rounded-sm">
                
                <div style="width: 20mm; height: 20mm; flex-shrink: 0; background: white; padding: 1mm; border-radius: 2px; display: flex; justify-content: center; align-items: center;">
                    <canvas id="qrCanvas" style="width: 100%; height: 100%;"></canvas>
                </div>

                <div style="flex-grow: 1; padding-left: 2mm; display: flex; flex-direction: column; justify-content: center; overflow: hidden;">
                    <div id="lblNama" style="font-family: Arial, sans-serif; font-size: 8.5pt; font-weight: 900; color: black; line-height: 1.1; text-transform: uppercase; max-height: 19pt; overflow: hidden;">
                        SAMPEL PRODUK
                    </div>
                    
                    <div id="lblSKU" style="font-family: Arial, sans-serif; font-size: 6pt; font-weight: bold; color: #444; margin-top: 1px;">
                        SKU-000
                    </div>
                    
                    <div id="lblHarga" style="font-family: Arial, sans-serif; font-size: 11pt; font-weight: 900; color: black; margin-top: 2px; letter-spacing: -0.5px;">
                        Rp 0
                    </div>
                </div>

            </div>

            <button id="btnPrint" onclick="window.print()" disabled class="w-full bg-gray-300 text-gray-500 font-extrabold py-4 rounded-xl shadow-sm transition-all mt-6 text-lg flex justify-center items-center gap-2 cursor-not-allowed">
                🖨️ CETAK LABEL SEKARANG
            </button>
        </div>

    </div>

    <script>
        // Link CSV Google Sheets Database Anda
        const csvUrl = 'https://docs.google.com/spreadsheets/d/1O52V8VzB-2jFh16oG-qjU1xO8M38mYm6/export?format=csv'; 
        
        let productDatabase = {}; // Menyimpan data spesifik
        let qr = new QRious({
            element: document.getElementById('qrCanvas'),
            background: 'white',
            foreground: 'black',
            level: 'H',
            size: 200,
            value: 'DTI'
        });

        // Format Rupiah
        function formatRupiah(angka) {
            if(!angka || isNaN(angka)) return "Rp 0";
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        // Ambil Data CSV saat halaman dimuat
        async function fetchDatabase() {
            try {
                const response = await fetch(csvUrl);
                const csvText = await response.text();
                parseCSVToDict(csvText);
            } catch (error) {
                document.getElementById('loadingStatus').innerText = "❌ Gagal memuat database. Pastikan koneksi internet aktif.";
                document.getElementById('loadingStatus').classList.replace('text-amber-500', 'text-red-500');
            }
        }

        // Parsing CSV dan Filter HANYA SKU Induk
        function parseCSVToDict(str) {
            const arr = [];
            let quote = false, row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            
            arr.shift(); // Buang Header Row 1

            const dataListElement = document.getElementById('skuList');
            productDatabase = {}; // Reset

            arr.forEach(rowData => {
                const sku = rowData[1];     // Kolom SKU
                const nama = rowData[3];    // Kolom Nama Sampel
                const harga = rowData[6];   // Kolom Harga Jual

                // Mencegah duplikat: Jika SKU Induk sudah masuk ke database, lewati baris varian berikutnya
                if (sku && !productDatabase[sku]) {
                    // Simpan data
                    productDatabase[sku] = {
                        nama: nama,
                        harga: harga
                    };

                    // Tambahkan ke dropdown pencarian (Format: SKU | Nama Produk)
                    const option = document.createElement('option');
                    option.value = sku;
                    option.text = nama;
                    dataListElement.appendChild(option);
                }
            });

            // Update UI Sukses
            document.getElementById('loadingStatus').innerText = "✅ Database Terhubung. Silakan cari produk.";
            document.getElementById('loadingStatus').classList.replace('text-amber-500', 'text-emerald-600');
            document.getElementById('loadingStatus').classList.remove('animate-pulse');
        }

        // Fungsi Auto-Fill saat Admin memilih produk
        function autoFillLabel() {
            const inputVal = document.getElementById('searchBox').value.trim();
            const btnPrint = document.getElementById('btnPrint');

            // Cek apakah SKU yang diketik/dipilih ada di database (SKU Induk)
            if (productDatabase[inputVal]) {
                const data = productDatabase[inputVal];

                // Update UI Label
                document.getElementById('lblSKU').innerText = inputVal.toUpperCase();
                document.getElementById('lblNama').innerText = data.nama.toUpperCase();
                
                // HARGA DIPERBESAR DAN TANPA SATUAN
                document.getElementById('lblHarga').innerText = formatRupiah(data.harga);

                // Update QR Code
                qr.value = inputVal.toUpperCase();

                // Aktifkan tombol print
                btnPrint.disabled = false;
                btnPrint.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                btnPrint.classList.add('bg-amber-400', 'hover:bg-amber-500', 'text-black', 'shadow-md', 'cursor-pointer');
            } else {
                // Nonaktifkan tombol print jika input tidak valid
                btnPrint.disabled = true;
                btnPrint.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                btnPrint.classList.remove('bg-amber-400', 'hover:bg-amber-500', 'text-black', 'shadow-md', 'cursor-pointer');
            }
        }

        // Jalankan tarik data otomatis saat pertama kali buka web
        window.onload = fetchDatabase;
    </script>
</body>
</html>
