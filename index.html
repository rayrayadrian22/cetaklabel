<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label 24mm - Double Two Interior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        /* =========================================
           TETAPAN CETAKAN KHAS EPSON LW-600P
           Pita 24mm | Potongan 50mm (Landskap)
           ========================================= */
        @media print {
            body > :not(#printAreaWrapper) {
                display: none !important;
            }
            body {
                background-color: transparent !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            #printAreaWrapper {
                display: flex !important;
                position: fixed;
                top: 0;
                left: 0;
                width: 50mm !important;
                height: 24mm !important;
                background: white !important; 
                padding: 1.5mm !important;
                box-sizing: border-box !important;
                align-items: center !important;
                justify-content: flex-start !important;
                gap: 2mm !important;
                page-break-after: always;
            }
            @page {
                size: 50mm 24mm;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-10">

    <div class="bg-white shadow-sm p-5 mb-6 border-b border-gray-200">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-gray-900 uppercase tracking-wider">Cetak Label Fizikal</h1>
                <p class="text-xs text-gray-500 font-medium">Epson LW-600P (24x50mm) - Khas SKU Induk</p>
            </div>
            <div id="loadingStatus" class="text-sm font-bold text-amber-500 animate-pulse">
                ⏳ Memuatkan Data...
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 space-y-4">
        
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 Cari nama sampel atau SKU..." class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-400 outline-none transition-all text-sm">
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-xs uppercase tracking-wider text-gray-600">
                            <th class="p-4 border-b">SKU Induk</th>
                            <th class="p-4 border-b">Nama Sampel</th>
                            <th class="p-4 border-b">Harga Jualan</th>
                            <th class="p-4 border-b text-center">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm divide-y divide-gray-100">
