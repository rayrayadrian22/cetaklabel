<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label 24mm - Double Two Interior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        /* =========================================
           PENGATURAN CETAK KHUSUS EPSON LW-600P
           Tape 24mm | Potongan 50mm (Landscape)
           ========================================= */
        @media print {
            body > :not(#printAreaWrapper) {
                display: none !important;
            }
            body {
                background-color: transparent !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            #printAreaWrapper {
                display: flex !important;
                position: fixed;
                top: 0;
                left: 0;
                width: 50mm !important;
                height: 24mm !important;
                background: white !important; 
                padding: 1.5mm !important;
                box-sizing: border-box !important;
                align-items: center !important;
                justify-content: flex-start !important;
                gap: 2mm !important;
                page-break-after: always;
            }
            @page {
                size: 50mm 24mm;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-10">

    <div class="bg-white shadow-sm p-5 mb-6 border-b border-gray-200">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black text-gray-900 uppercase tracking-wider">Cetak Label Fisik</h1>
                <p class="text-xs text-gray-500 font-medium">Epson LW-600P (24x50mm) - Khusus SKU Induk</p>
            </div>
            <div id="loadingStatus" class="text-sm font-bold text-amber-500 animate-pulse">
                ⏳ Memuat Data...
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 space-y-4">
        
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 Cari nama sampel atau SKU..." class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-400 outline-none transition-all text-sm">
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-xs uppercase tracking-wider text-gray-600">
                            <th class="p-4 border-b">SKU Induk</th>
                            <th class="p-4 border-b">Nama Sampel</th>
                            <th class="p-4 border-b">Harga Jual</th>
                            <th class="p-4 border-b text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm divide-y divide-gray-100">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="printAreaWrapper" class="hidden">
        <div style="width: 20mm; height: 20mm; flex-shrink: 0; background: white; padding: 1mm; border-radius: 2px; display: flex; justify-content: center; align-items: center;">
            <canvas id="qrCanvas" style="width: 100%; height: 100%;"></canvas>
        </div>
        <div style="flex-grow: 1; padding-left: 2mm; display: flex; flex-direction: column; justify-content: center; overflow: hidden;">
            <div id="lblNama" style="font-family: Arial, sans-serif; font-size: 8.5pt; font-weight: 900; color: black; line-height: 1.1; text-transform: uppercase; max-height: 19pt; overflow: hidden;">
                NAMA SAMPEL
            </div>
            <div id="lblSKU" style="font-family: Arial, sans-serif; font-size: 6pt; font-weight: bold; color: #444; margin-top: 1px;">
                SKU-000
            </div>
            <div id="lblHarga" style="font-family: Arial, sans-serif; font-size: 11pt; font-weight: 900; color: black; margin-top: 2px; letter-spacing: -0.5px;">
                Rp 0
            </div>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/1O52V8VzB-2jFh16oG-qjU1xO8M38mYm6/export?format=csv'; 
        let globalData = []; // Menyimpan data SKU Induk murni

        // Inisialisasi QRious (Satu objek dipakai berulang)
        let qr = new QRious({
            element: document.getElementById('qrCanvas'),
            background: 'white',
            foreground: 'black',
            level: 'H',
            size: 250 // Resolusi tinggi untuk cetak thermal
        });

        // Format Rupiah
        function formatRupiah(angka) {
            if(!angka || isNaN(angka)) return "Rp 0";
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

// Ambil Data CSV
        async function fetchDatabase() {
            try {
                const response = await fetch(csvUrl);
                const csvText = await response.text();

                // 🛡️ FITUR KEAMANAN BARU: Cek jika yang ter-download malah kode HTML/Login Page
                if (csvText.trim().toLowerCase().startsWith('<!doctype') || csvText.trim().toLowerCase().startsWith('<html')) {
                    document.getElementById('loadingStatus').innerText = "❌ Akses Ditolak! Ubah setting Share Google Sheets menjadi 'Anyone with the link'.";
                    document.getElementById('loadingStatus').classList.replace('text-amber-500', 'text-red-600');
                    return; // Hentikan proses agar tabel tidak menampilkan kode aneh
                }

                parseCSV(csvText);
            } catch (error) {
                document.getElementById('loadingStatus').innerText = "❌ Gagal memuat database. Periksa koneksi internet.";
                document.getElementById('loadingStatus').classList.replace('text-amber-500', 'text-red-600');
            }
        }

        // Parsing & Filter HANYA SKU Induk
        function parseCSV(str) {
            const arr = [];
            let quote = false, row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            
            arr.shift(); // Buang Header Row

            const seenSKU = new Set();
            globalData = [];

            arr.forEach(rowData => {
                const sku = rowData[1];     // Kolom SKU
                const nama = rowData[3];    // Kolom Nama Sampel
                const harga = rowData[6];   // Kolom Harga Jual

                // FILTER: Hanya masukkan jika SKU belum ada di Set (Otomatis membuang varian duplikat)
                if (sku && !seenSKU.has(sku)) {
                    seenSKU.add(sku);
                    globalData.push({
                        sku: sku,
                        nama: nama,
                        harga: harga
                    });
                }
            });

            // Update UI Sukses
            document.getElementById('loadingStatus').innerText = "✅ Database Siap";
            document.getElementById('loadingStatus').classList.replace('text-amber-500', 'text-emerald-600');
            document.getElementById('loadingStatus').classList.remove('animate-pulse');

            // Render Tabel Pertama Kali
            renderTable(globalData);
        }

        // Render Data ke Tabel HTML
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-500 italic">Data tidak ditemukan...</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-amber-50 transition-colors';
                
                // Gunakan backticks untuk HTML multi-baris
                tr.innerHTML = `
                    <td class="p-4 font-mono text-xs font-bold text-gray-600">${item.sku}</td>
                    <td class="p-4 font-bold text-gray-900 uppercase">${item.nama}</td>
                    <td class="p-4 font-black text-emerald-600">${formatRupiah(item.harga)}</td>
                    <td class="p-4 text-center">
                        <button onclick="cetakLabel('${item.sku}', '${item.nama}', '${item.harga}')" class="bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm transition-all flex items-center justify-center gap-2 w-full mx-auto max-w-[120px]">
                            🖨️ Cetak
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Fitur Filter/Pencarian Instan
        function filterTable() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filteredData = globalData.filter(item => {
                return item.nama.toLowerCase().includes(keyword) || item.sku.toLowerCase().includes(keyword);
            });
            renderTable(filteredData);
        }

        // --- EKSEKUSI CETAK LABEL ---
        function cetakLabel(sku, nama, harga) {
            // 1. Masukkan Teks ke area cetak tersembunyi
            document.getElementById('lblSKU').innerText = sku.toUpperCase();
            document.getElementById('lblNama').innerText = nama.toUpperCase();
            document.getElementById('lblHarga').innerText = formatRupiah(harga); // Harga diperbesar, tanpa satuan

            // 2. Generate QR Code
            qr.value = sku.toUpperCase();

            // 3. Panggil Dialog Print Browser
            window.print();
        }

        // Tarik data saat halaman dibuka
        window.onload = fetchDatabase;
    </script>
</body>
</html>
